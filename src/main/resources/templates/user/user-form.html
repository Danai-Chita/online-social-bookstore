<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Form</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
    <style>
        .required::before {
            content: "* ";
            color: red;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="my-4">Edit Your Personal Profile Informations</h1>
    <form th:action="@{/user/saveUser}" th:object="${userProfile}" method="post" id="userProfileForm">
        <div class="form-group">
            <label for="fullName" class="required">Full name:</label>
            <input type="text" class="form-control" id="fullName" name="fullName" th:value="${userProfile.fullName}" required/>
        </div>
        <div class="form-group">
            <label for="address">Address:</label>
            <input type="text" class="form-control" id="address" name="address" th:value="${userProfile.address}"/>
        </div>
        <div class="form-group">
            <label for="phoneNumber" class="required">Phone Number:</label>
            <input type="text" class="form-control" id="phoneNumber" name="phoneNumber" th:value="${userProfile.phoneNumber}" data-toggle="tooltip" data-placement="right" title="Must have 10 digits"/>
        </div>
        <div class="form-group">
            <label for="age" class="required">Age:</label>
            <input type="text" class="form-control" id="age" name="age" th:value="${userProfile.age}" data-toggle="tooltip" data-placement="right" title="Must be greater than 0"/>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
        <a th:href="@{register}" class="btn btn-primary">Return</a>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.6/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>

	$(document).ready(function() {
	    $('[data-toggle="tooltip"]').tooltip();
	
	    $("#phoneNumber").focus(function() {
	        $(this).attr("title", "Must have 10 digits");
	        $(this).tooltip("show");
	    });
	
	    $("#age").focus(function() {
	        $(this).attr("title", "Must be greater than 0");
	        $(this).tooltip("show");
	    });
	
	    $("#studentForm").submit(function(event) {
	        var yearOfStudies = $("#yearOfStudies").val();
	        var currentAverageGrade = $("#currentAverageGrade").val();
	        var remainingCourses = $("#remainingCourses").val();
	        var age = $("#age").val();
	        var AM = $("#AM").val();
	
	        if (yearOfStudies == 0 || currentAverageGrade == 0 || remainingCourses < 0) {
	            event.preventDefault();
	            alert("Fields 'Years of Studies', 'Current Average Grade', and 'Remaining Courses' have invalid values.");
	        }
	
	        if (currentAverageGrade < 5.0 || currentAverageGrade > 10.0) {
	            event.preventDefault();
	            alert("Current Average Grade must be between 5.0 and 10.0.");
	        }
	
	        if (age === "") {
	            $("#age").val(0);
	        }
	
	        if (AM === "") {
	            $("#AM").val(0);
	        }
	    });
	});
</script>

</body>
</html>
